<!DOCTYPE html>

<style>
  /* VOICE: a quiet club table; the board is the whole picture.

  :root {

    --me: var(--c-blue); --me-edge: var(--c-blue-edge); --me-ink: var(--c-blue-ink); --opp: var(--c-white); --opp-edge: var(--c-white-edge); --opp-ink: var(--c-white-ink);
    --felt: #d9cfb7; --frame: #6b5a43; --pt1: #a8875c; --pt2: #e9e0cc; --sel: #e7eef6;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) {

    --accent: #6fa3d8; --accent-ink: #0d1b28; --good: #6cc392; --warn: #e3a25f; --bad: #e07a7a;
    --c-blue: #5b8fc4; --c-blue-edge: #9cc0e6; --c-white: #efece4; --c-white-edge: #8f8b80;
    --felt: #3a352b; --frame: #22201b; --pt1: #7a6243; --pt2: #575043; --sel: #22303d; } }
  :root[data-theme=dark] {
    --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a3a199; --line: #34332f;
    --accent: #6fa3d8; --accent-ink: #0d1b28; --good: #6cc392; --warn: #e3a25f; --bad: #e07a7a;
    --c-blue: #5b8fc4; --c-blue-edge: #9cc0e6; --c-white: #efece4; --c-white-edge: #8f8b80;
    --felt: #3a352b; --frame: #22201b; --pt1: #7a6243; --pt2: #575043; --sel: #22303d; }
  body.swapc { --me: var(--c-white); --me-edge: var(--c-white-edge); --me-ink: var(--c-white-ink); --opp: var(--c-blue); --opp-edge: var(--c-blue-edge); --opp-ink: var(--c-blue-ink); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; min-width: 0; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; display: flex; gap: 8px;
    padding: max(5px, env(safe-area-inset-top)) max(5px, env(safe-area-inset-right)) max(5px, env(safe-area-inset-bottom)) max(5px, env(safe-area-inset-left)); }
  #boardWrap { flex: 1; position: relative; }
  #board { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  #board.shake { animation: shake .28s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  @keyframes pulse { 50% { opacity: .55; } }
  #side { width: clamp(240px, 33vw, 340px); display: flex; flex-direction: column; gap: 7px; overflow-y: auto; overscroll-behavior: contain; }
  .bar-top { display: flex; align-items: center; gap: 6px; }

  .score { font-size: 12.5px; color: var(--muted); }
  .status { font-size: 16px; font-weight: 650; line-height: 1.3; }

  .row { display: flex; gap: 6px; flex-wrap: wrap; } .row > * { flex: 1 1 0; }

    padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
  .ov.open { display: flex; }
  .sheet { background: var(--panel); border-radius: 14px; padding: 12px 14px; margin: auto; max-height: 96vh; max-height: 96dvh; overflow-y: auto; width: min(560px, 96vw); }
  @media (orientation: landscape) and (min-width: 640px) { .sheet { width: min(900px, 96vw); } .mgrid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; align-items: start; } }
  .mhead { display: flex; align-items: center; justify-content: space-between; } .mhead h3 { margin: 0; font-size: 17px; }
  .sheet h4 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { flex: 1; border: 0; border-radius: 0; min-height: 40px; padding: 0 4px; } .seg button + button { border-left: 1px solid var(--line); }
  .tograw { display: flex; flex-direction: column; gap: 2px; }
  .tog { display: flex; align-items: center; gap: 8px; min-height: 38px; cursor: pointer; }
  .tog input { width: 20px; height: 20px; accent-color: var(--accent); }
  .tog.autoroll { flex-wrap: wrap; column-gap: 8px; row-gap: 0; padding: 2px 0; }
  .tog.autoroll .small { flex: 1 1 auto; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
  .field button { min-width: 44px; }
  .stepper { display: inline-flex; align-items: center; gap: 8px; } .stepper b { min-width: 2ch; text-align: center; font-size: 16px; }
  .saved { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .sv { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
  textarea.paste { width: 100%; min-height: 120px; font: 16px ui-monospace, monospace; word-break: break-all; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); color: var(--ink); margin: 6px 0; }
  textarea.paste.zone { min-height: 46px; height: 46px; resize: none; overflow: hidden; margin: 0; padding: 12px 10px; font: 15px/1.35 system-ui, sans-serif; border: 1.5px dashed var(--line); border-radius: 10px; background: var(--panel); flex: none; }
  textarea.paste.zone::placeholder { color: var(--muted); }
  .zonewrap { display: flex; flex-direction: column; gap: 3px; flex: none; }
  @supports (-webkit-touch-callout: none) { textarea.paste.zone { font-size: 16px; } }
  .toast { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 9px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; max-width: 92vw; text-align: center; }

  #update.show { display: block; }
  /* the review (the analyzer's page) covers the game while it is open */
  #rvFrame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 40; background: var(--bg); }
  @media (orientation: portrait) {
    #app { flex-direction: column; gap: 6px; }

  @media (prefers-reduced-motion: reduce) { #board.shake, #board .pulse rect, .status.run::after { animation: none; } }
